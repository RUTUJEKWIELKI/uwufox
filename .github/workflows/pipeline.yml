# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Uwufox Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Numeric app version tag, for example 153.8.0.
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    uses: ./.github/workflows/uwufox.yml
    permissions:
      contents: write
    with:
      release_tag: ${{ inputs.release_tag }}

# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Uwufox Build Pipeline

on:
  push:
    branches:
      - current
  workflow_dispatch:
    inputs:
      date:
        description: Build date (YYYYMMDDHHMMSS), leave empty for current UTC
        required: false
        type: string
      prerelease:
        description: Pre-release build
        required: false
        default: 'true'
        type: string
      tags:
        description: Display version (defaults to browser/config/version.txt)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: uwufox-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Build parameters
    runs-on: ubuntu-24.04
    outputs:
      build_date: ${{ steps.build.outputs.build_date }}
      display_version: ${{ steps.build.outputs.display_version }}
    steps:
      - name: Checkout version
        uses: actions/checkout@v4
        with:
          sparse-checkout: browser/config/version.txt
          sparse-checkout-cone-mode: false
      - name: Resolve parameters
        id: build
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_TAGS: ${{ inputs.tags }}
        shell: bash
        run: |
          BUILD_DATE="${INPUT_DATE:-$(date -u +%Y%m%d%H%M%S)}"
          DISPLAY_VERSION="${INPUT_TAGS:-$(tr -d '\r\n' < browser/config/version.txt)}"
          [[ "$BUILD_DATE" =~ ^[0-9]{14}$ ]] || exit 1
          [[ -n "$DISPLAY_VERSION" ]] || exit 1
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build all platforms (resource-efficient)
    needs: metadata
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/build.yml
    with:
      MOZ_BUILD_DATE: ${{ needs.metadata.outputs.build_date }}
      PRE_RELEASE: ${{ inputs.prerelease || 'true' }}
      TAG_VERSION: ${{ needs.metadata.outputs.display_version }}

  stage:
    name: Stage unsigned outputs
    needs: build
    if: ${{ success() }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/stage.yml

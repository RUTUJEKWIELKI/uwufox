# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Stage unsigned builds

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate unsigned build artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Check finished platform artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo,
              run_id: context.runId,
              per_page: 100,
            });
            const names = result.map(a => a.name);
            const required = ['linux-build', 'linux-aarch64-build', 'windows-x86_64-pc-windows-msvc-build', 'windows-aarch64-pc-windows-msvc-build', 'macos-x86_64-apple-darwin-build', 'macos-aarch64-apple-darwin-build'];
            for (const name of required) {
              if (!names.includes(name)) core.setFailed('Missing platform artifact: ' + name);
            }
            if (!names.includes('build-metadata')) {
              core.setFailed('Missing build-metadata artifact');
            }
            core.info('Unsigned build artifacts: ' + names.join(', '));
            await core.summary.addHeading('Unsigned UwUfox build artifacts').addRaw(names.join(', ')).write();

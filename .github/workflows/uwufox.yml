# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Uwufox Build

on:
  push:
    branches:
      - current
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional numeric app version tag, for example 153.8.0.
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string

permissions:
  contents: write

jobs:
  resolve-auto-version:
    name: Resolve automatic release version
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - name: Check out version and release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            browser/config/version.txt
            scripts/ci/next-release-version.py
          sparse-checkout-cone-mode: false

      - name: Generate automatic release version
        id: version
        if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
        run: |
          git tag --list > "$RUNNER_TEMP/uwufox-tags.txt"
          AUTO_VERSION="$(python3 scripts/ci/next-release-version.py \
            --base-version "$(tr -d '\r\n' < browser/config/version.txt)" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --tags-file "$RUNNER_TEMP/uwufox-tags.txt")"
          echo "release_tag=$AUTO_VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version=$AUTO_VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Linux x86-64
    needs: resolve-auto-version
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    env:
      MOZ_APPUPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/update-linux.xml
      RELEASE_TAG: ${{ inputs.release_tag || needs.resolve-auto-version.outputs.release_tag || '' }}
      AUTO_RELEASE_VERSION: ${{ needs.resolve-auto-version.outputs.app_version || '' }}
      MOZCONFIG: waterfox/build/mozconfig-uwufox-linux

      RUST_TOOLCHAIN: 1.99.1
    steps:
      - name: Expand build disk
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 32768
          temp-reserve-mb: 16384
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Verify runner root space
        shell: bash
        run: |
          available_kb="$(df --block-size=1024 --output=avail / | tail -n 1)"
          required_kb=$((8 * 1024 * 1024))
          if (( available_kb < required_kb )); then
            echo "::error::Only $((available_kb / 1024)) MiB are available on / after expanding the build volume; at least 8192 MiB are required."
            exit 1
          fi
          df -h /

      - name: Clean up old build artifacts
        run: |
          # Clean up old objdirs to free up space
          find "$GITHUB_WORKSPACE" -maxdepth 2 -type d -name 'obj-*' -exec rm -rf {} + 2>/dev/null || true
          # Clean up old dist directories
          find "$GITHUB_WORKSPACE" -maxdepth 3 -type d -name 'dist' -exec rm -rf {} + 2>/dev/null || true

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Configure build state and cache directories
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.mozbuild" \
            "$GITHUB_WORKSPACE/.rustup" \
            "$GITHUB_WORKSPACE/.cargo" \
            "$GITHUB_WORKSPACE/.tmp"
          {
            echo "MOZBUILD_STATE_PATH=$GITHUB_WORKSPACE/.mozbuild"
            echo "RUSTUP_HOME=$GITHUB_WORKSPACE/.rustup"
            echo "CARGO_HOME=$GITHUB_WORKSPACE/.cargo"
            echo "TMPDIR=$GITHUB_WORKSPACE/.tmp"
          } >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.cargo/bin" >> "$GITHUB_PATH"

      - name: Configure build parallelism
        shell: bash
        run: |
          jobs="$(nproc)"
          echo "MOZ_MAKE_FLAGS=-j${jobs}" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=${jobs}" >> "$GITHUB_ENV"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y msitools xvfb zip zstd

      - name: Install sccache
        run: |
          # Install sccache manually
          if ! command -v sccache >/dev/null 2>&1; then
            curl -L --retry 5 --fail -o "$RUNNER_TEMP/sccache.tar.gz" \
              "https://github.com/mozilla/sccache/releases/download/v0.7.5/sccache-v0.7.5-x86_64-unknown-linux-gnu.tar.gz"
            tar -xzf "$RUNNER_TEMP/sccache.tar.gz" -C "$HOME/.cargo/bin/" --strip-components=1
            chmod +x "$HOME/.cargo/bin/sccache"
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Setup sccache
        shell: bash
        run: |
          # Find sccache binary
          SCCACHE_PATH="$(which sccache 2>/dev/null || echo '$HOME/.cargo/bin/sccache')"
          if [[ ! -x "$SCCACHE_PATH" ]]; then
            SCCACHE_PATH="$HOME/.cargo/bin/sccache"
          fi
          # Setup sccache for C/C++ compilation
          echo "CC=sccache cc" >> "$GITHUB_ENV"
          echo "CXX=sccache c++" >> "$GITHUB_ENV"
          # Setup sccache for Rust
          echo "RCCACHE_PROG=$SCCACHE_PATH" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "MOZ_RUST_DEFAULT_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          # Ensure sccache is in PATH
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            .rustup
            .cargo
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Bootstrap build dependencies
        run: ./mach --no-interactive bootstrap --application-choice browser

      - name: Fetch Clang and WASI sysroot
        run: scripts/fetch-clang-23.sh

      - name: Set release version
        run: |
          if [[ -n "$RELEASE_TAG" && ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "release_tag must be a numeric app version" >&2
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            echo WFX_RELEASE=1 >> "$GITHUB_ENV"
            DISPLAY_VERSION="$RELEASE_TAG"
            if [[ -n "$AUTO_RELEASE_VERSION" ]]; then
              printf '%s\n' "$AUTO_RELEASE_VERSION" > browser/config/version.txt
            elif [[ "$(tr -d '\r\n' < browser/config/version.txt)" != "$RELEASE_TAG" ]]; then
              echo "For manual releases, release_tag must match browser/config/version.txt" >&2
              exit 1
            fi
          else
            DISPLAY_VERSION="dev-${GITHUB_SHA:0:12}"
          fi
          printf '%s\n' "$DISPLAY_VERSION" > browser/config/version_display.txt
          echo "MOZ_BUILD_DATE=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
          echo "DISPLAY_VERSION=$DISPLAY_VERSION" >> "$GITHUB_ENV"

      - name: Build and package
        run: |
          set -o pipefail
          ./mach build 2>&1 | tail -n 200
          ./mach package 2>&1 | tail -n 200

          OBJDIR="obj-x86_64-pc-linux-gnu"
          DIST="$OBJDIR/dist/uwufox"
          mkdir -p artifacts
          if [[ -n "$RELEASE_TAG" ]]; then
            touch "$DIST/precomplete"
          fi
          tar -C "$OBJDIR/dist" -cJf "artifacts/uwufox-${DISPLAY_VERSION}-linux-x86_64.tar.xz" uwufox

          if [[ -n "$RELEASE_TAG" ]]; then
            APP_VERSION="$(awk -F= '/^\[App\]/{app=1;next} /^\[/{app=0} app && $1=="Version"{print $2;exit}' "$DIST/application.ini")"
            test -n "$APP_VERSION"
            MAR="$PWD/$OBJDIR/dist/host/bin/mar" \
              MAR_CHANNEL_ID=release \
              MOZ_PRODUCT_VERSION="$APP_VERSION" \
              ./tools/update-packaging/make_full_update.sh \
                "$PWD/artifacts/uwufox-${RELEASE_TAG}-linux-x86_64.complete.mar" "$DIST"
            python3 scripts/ci/make-update-xml.py \
              --application-ini "$DIST/application.ini" \
              --mar "artifacts/uwufox-${RELEASE_TAG}-linux-x86_64.complete.mar" \
              --repository "$GITHUB_REPOSITORY" \
              --release-tag "$RELEASE_TAG" \
              --display-version "$DISPLAY_VERSION" \
              --output artifacts/update-linux.xml
          fi
          (cd artifacts && sha512sum * > SHA512SUMS-linux-x86_64.txt)

      - name: Save build artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: uwufox-${{ github.sha }}-linux-x86_64
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  build-other-platforms:
    name: ${{ matrix.target_name }}
    needs: resolve-auto-version
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - target_name: linux-aarch64
            mozconfig: waterfox/build/mozconfig-uwufox-linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            update_name: linux-aarch64
            package_format: tar
          - target_name: windows-x86_64
            mozconfig: waterfox/build/mozconfig-x86_64-pc-windows-msvc
            rust_target: x86_64-pc-windows-msvc
            update_name: windows-x86_64
            package_format: zip
          - target_name: windows-aarch64
            mozconfig: waterfox/build/mozconfig-aarch64-pc-windows-msvc
            rust_target: aarch64-pc-windows-msvc
            update_name: windows-aarch64
            package_format: zip
          - target_name: macos-x86_64
            mozconfig: waterfox/build/mozconfig-x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
            update_name: macos-x86_64
            package_format: macos
          - target_name: macos-aarch64
            mozconfig: waterfox/build/mozconfig-aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            update_name: macos-aarch64
            package_format: macos
    env:
      MOZ_APPUPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/update-${{ matrix.update_name }}.xml
      RELEASE_TAG: ${{ inputs.release_tag || needs.resolve-auto-version.outputs.release_tag || '' }}
      AUTO_RELEASE_VERSION: ${{ needs.resolve-auto-version.outputs.app_version || '' }}
      MOZCONFIG: ${{ matrix.mozconfig }}

      RUST_TOOLCHAIN: 1.99.1
      TARGET_NAME: ${{ matrix.target_name }}
      RUST_TARGET: ${{ matrix.rust_target }}
      UPDATE_NAME: ${{ matrix.update_name }}
      PACKAGE_FORMAT: ${{ matrix.package_format }}
    steps:
      - name: Expand build disk
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 32768
          temp-reserve-mb: 16384
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Verify runner root space
        shell: bash
        run: |
          available_kb="$(df --block-size=1024 --output=avail / | tail -n 1)"
          required_kb=$((8 * 1024 * 1024))
          if (( available_kb < required_kb )); then
            echo "::error::Only $((available_kb / 1024)) MiB are available on / after expanding the build volume; at least 8192 MiB are required."
            exit 1
          fi
          df -h /

      - name: Clean up old build artifacts
        run: |
          # Clean up old objdirs to free up space
          find "$GITHUB_WORKSPACE" -maxdepth 2 -type d -name 'obj-*' -exec rm -rf {} + 2>/dev/null || true
          # Clean up old dist directories
          find "$GITHUB_WORKSPACE" -maxdepth 3 -type d -name 'dist' -exec rm -rf {} + 2>/dev/null || true

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Configure build state and cache directories
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.mozbuild" \
            "$GITHUB_WORKSPACE/.rustup" \
            "$GITHUB_WORKSPACE/.cargo" \
            "$GITHUB_WORKSPACE/.tmp"
          {
            echo "MOZBUILD_STATE_PATH=$GITHUB_WORKSPACE/.mozbuild"
            echo "RUSTUP_HOME=$GITHUB_WORKSPACE/.rustup"
            echo "CARGO_HOME=$GITHUB_WORKSPACE/.cargo"
            echo "TMPDIR=$GITHUB_WORKSPACE/.tmp"
          } >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.cargo/bin" >> "$GITHUB_PATH"

      - name: Configure build parallelism
        shell: bash
        run: |
          jobs="$(nproc)"
          echo "MOZ_MAKE_FLAGS=-j${jobs}" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=${jobs}" >> "$GITHUB_ENV"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y msitools xvfb zip zstd

      - name: Install sccache
        run: |
          # Install sccache manually
          if ! command -v sccache >/dev/null 2>&1; then
            curl -L --retry 5 --fail -o "$RUNNER_TEMP/sccache.tar.gz" \
              "https://github.com/mozilla/sccache/releases/download/v0.7.5/sccache-v0.7.5-x86_64-unknown-linux-gnu.tar.gz"
            tar -xzf "$RUNNER_TEMP/sccache.tar.gz" -C "$HOME/.cargo/bin/" --strip-components=1
            chmod +x "$HOME/.cargo/bin/sccache"
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Setup sccache
        shell: bash
        run: |
          # Find sccache binary
          SCCACHE_PATH="$(which sccache 2>/dev/null || echo '$HOME/.cargo/bin/sccache')"
          if [[ ! -x "$SCCACHE_PATH" ]]; then
            SCCACHE_PATH="$HOME/.cargo/bin/sccache"
          fi
          # Setup sccache for C/C++ compilation
          echo "CC=sccache cc" >> "$GITHUB_ENV"
          echo "CXX=sccache c++" >> "$GITHUB_ENV"
          # Setup sccache for Rust
          echo "RCCACHE_PROG=$SCCACHE_PATH" >> "$GITHUB_ENV"
          echo "MOZ_RUST_DEFAULT_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          # Ensure sccache is in PATH
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUST_TOOLCHAIN" "$RUST_TARGET"
          rustup default "$RUST_TOOLCHAIN"

      - name: Bootstrap build dependencies
        run: ./mach --no-interactive bootstrap --application-choice browser

      - name: Fetch Clang and WASI sysroot
        run: scripts/fetch-clang-23.sh

      - name: Fetch 7-Zip for Windows installer
        if: startsWith(matrix.target_name, 'windows-')
        run: |
          curl -L --retry 5 --fail -o "$RUNNER_TEMP/7zz.tar.zst" \
            https://firefox-ci-tc.services.mozilla.com/api/index/v1/task/gecko.cache.level-3.toolchains.v3.linux64-7zz.latest/artifacts/public/build/7zz.tar.zst
          mkdir -p "$RUNNER_TEMP/7zz"
          tar --zstd --strip-components=1 -xf "$RUNNER_TEMP/7zz.tar.zst" -C "$RUNNER_TEMP/7zz"
          sudo install -m 0755 "$RUNNER_TEMP/7zz/7zz" /usr/local/bin/7zz

      - name: Set release version
        run: |
          if [[ -n "$RELEASE_TAG" && ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "release_tag must be a numeric app version" >&2
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            echo WFX_RELEASE=1 >> "$GITHUB_ENV"
            DISPLAY_VERSION="$RELEASE_TAG"
            if [[ -n "$AUTO_RELEASE_VERSION" ]]; then
              printf '%s\n' "$AUTO_RELEASE_VERSION" > browser/config/version.txt
            elif [[ "$(tr -d '\r\n' < browser/config/version.txt)" != "$RELEASE_TAG" ]]; then
              echo "For manual releases, release_tag must match browser/config/version.txt" >&2
              exit 1
            fi
          else
            DISPLAY_VERSION="dev-${GITHUB_SHA:0:12}"
          fi
          printf '%s\n' "$DISPLAY_VERSION" > browser/config/version_display.txt
          echo "MOZ_BUILD_DATE=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
          echo "DISPLAY_VERSION=$DISPLAY_VERSION" >> "$GITHUB_ENV"

      - name: Build and package
        run: |
          set -o pipefail
          ./mach build 2>&1 | tail -n 200
          ./mach package 2>&1 | tail -n 200

          OBJDIR="obj-${RUST_TARGET}"
          DIST="$OBJDIR/dist/uwufox"
          mkdir -p artifacts

          if [[ "$PACKAGE_FORMAT" == "macos" ]]; then
            APP_PATH="$(find "$DIST" -maxdepth 2 -type d -name '*.app' -print -quit)"
            test -n "$APP_PATH"
            if [[ -n "$RELEASE_TAG" ]]; then
              touch "$APP_PATH/Contents/Resources/precomplete"
            fi
            APP_NAME="$(basename "$APP_PATH")"
            tar -C "$DIST" -cJf "artifacts/uwufox-${DISPLAY_VERSION}-${TARGET_NAME}.tar.xz" "$APP_NAME"
            APPLICATION_INI="$APP_PATH/Contents/Resources/application.ini"
            UPDATE_DIR="$APP_PATH"
          elif [[ "$PACKAGE_FORMAT" == "zip" ]]; then
            if [[ -n "$RELEASE_TAG" ]]; then
              touch "$DIST/precomplete"
            fi
            ZIP_FILE="$PWD/artifacts/uwufox-${DISPLAY_VERSION}-${TARGET_NAME}.zip"
            (cd "$OBJDIR/dist" && zip -qr "$ZIP_FILE" uwufox)
            TARGET_ARCH="${TARGET_NAME#windows-}"
            INSTALLER_FILE="$PWD/artifacts/Uwufox-Setup-${DISPLAY_VERSION}-${TARGET_ARCH}.exe"
            SFX_STUB=other-licenses/7zstub/firefox/7zSD.Win32.sfx
            if [[ "$RUST_TARGET" == "aarch64-pc-windows-msvc" ]]; then
              SFX_STUB=other-licenses/7zstub/firefox/7zSD.ARM64.sfx
            fi
            ./mach repackage installer \
              --output "$INSTALLER_FILE" \
              --package-name uwufox \
              --package "$ZIP_FILE" \
              --tag browser/installer/windows/app.tag \
              --setupexe "$OBJDIR/browser/installer/windows/instgen/setup.exe" \
              --sfx-stub "$SFX_STUB"
            sha512sum "$ZIP_FILE" > "$ZIP_FILE.sha512"
            sha512sum "$INSTALLER_FILE" > "$INSTALLER_FILE.sha512"
            APPLICATION_INI="$DIST/application.ini"
            UPDATE_DIR="$DIST"
          else
            if [[ -n "$RELEASE_TAG" ]]; then
              touch "$DIST/precomplete"
            fi
            tar -C "$OBJDIR/dist" -cJf "artifacts/uwufox-${DISPLAY_VERSION}-${TARGET_NAME}.tar.xz" uwufox
            APPLICATION_INI="$DIST/application.ini"
            UPDATE_DIR="$DIST"
          fi

          if [[ -n "$RELEASE_TAG" ]]; then
            APP_VERSION="$(awk -F= '/^\[App\]/{app=1;next} /^\[/{app=0} app && $1=="Version"{print $2;exit}' "$APPLICATION_INI")"
            test -n "$APP_VERSION"
            MAR_FILE="artifacts/uwufox-${RELEASE_TAG}-${TARGET_NAME}.complete.mar"
            MAR="$PWD/$OBJDIR/dist/host/bin/mar" \
              MAR_CHANNEL_ID=release \
              MOZ_PRODUCT_VERSION="$APP_VERSION" \
              ./tools/update-packaging/make_full_update.sh "$PWD/$MAR_FILE" "$UPDATE_DIR"
            python3 scripts/ci/make-update-xml.py \
              --application-ini "$APPLICATION_INI" \
              --mar "$MAR_FILE" \
              --repository "$GITHUB_REPOSITORY" \
              --release-tag "$RELEASE_TAG" \
              --display-version "$DISPLAY_VERSION" \
              --output "artifacts/update-${UPDATE_NAME}.xml"
          fi
          (cd artifacts && sha512sum * > "SHA512SUMS-${TARGET_NAME}.txt")

      - name: Save build artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: uwufox-${{ github.sha }}-${{ matrix.target_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish unsigned GitHub Release
    needs:
      - resolve-auto-version
      - build
      - build-other-platforms
    if: ${{ inputs.release_tag || needs.resolve-auto-version.outputs.release_tag }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || needs.resolve-auto-version.outputs.release_tag }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4.3.0
        with:
          pattern: uwufox-${{ github.sha }}-*
          path: artifacts
          merge-multiple: true

      - name: Create or update GitHub Release
        run: |
          assets=(artifacts/*)
          test "${#assets[@]}" -gt 0
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "Uwufox $RELEASE_TAG" \
              --generate-notes
          fi

  promote-latest-release:
    name: Point updater at newest version
    needs: publish-release
    if: ${{ needs.publish-release.result == 'success' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: uwufox-latest-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark newest numeric release as latest
        run: |
          mapfile -t tags < <(gh release list --limit 1000 \
            --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName')
          newest=""
          for tag in "${tags[@]}"; do
            if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              continue
            fi
            if [[ -z "$newest" ]] ||
               [[ "$(printf '%s\n%s\n' "$newest" "$tag" | sort -V | tail -n 1)" == "$tag" ]]; then
              newest="$tag"
            fi
          done
          if [[ -n "$newest" ]]; then
            gh release edit "$newest" --latest
          fi

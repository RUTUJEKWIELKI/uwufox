# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Production (unsigned)

on:
  workflow_call:
    inputs:
      BUILD_RUN_ID:
        required: true
        type: string
      DISPLAY_VERSION:
        required: true
        type: string
      PRE_RELEASE:
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  github-release:
    name: Upload unsigned packages
    runs-on: ubuntu-24.04
    steps:
      - name: Download final platform artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.BUILD_RUN_ID }}
        shell: bash
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          mkdir -p downloaded
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern '*-build' --dir downloaded
          test -n "$(find downloaded -type f -print -quit)"
      - name: Make archives for each platform
        shell: bash
        run: |
          mkdir -p release
          for dir in downloaded/*; do
            [[ -d "$dir" ]] || continue
            tar -C "$dir" -czf "release/$(basename "$dir").tar.gz" .
          done
          (cd release && sha256sum *.tar.gz > SHA256SUMS.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.DISPLAY_VERSION }}
          PRE_RELEASE: ${{ inputs.PRE_RELEASE }}
        shell: bash
        run: |
          args=()
          if [[ "$PRE_RELEASE" == 'true' ]]; then
            args+=(--prerelease)
          fi
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes "${args[@]}"
          fi
          gh release upload "$VERSION" release/* --repo "$GITHUB_REPOSITORY" --clobber

# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build

on:
  workflow_dispatch:
    inputs:
      MOZ_BUILD_DATE:
        description: Build date (YYYYMMDDHHMMSS), shared by every platform build
        required: true
        type: string
      PRE_RELEASE:
        description: Mark the build as a pre-release
        required: false
        default: "true"
        type: string
      TAG_VERSION:
        description: Display version
        required: true
        type: string
  workflow_call:
    inputs:
      MOZ_BUILD_DATE:
        required: true
        type: string
      PRE_RELEASE:
        required: false
        default: "true"
        type: string
      TAG_VERSION:
        required: true
        type: string
    outputs:
      versiondisplay:
        description: Display version used for this build
        value: ${{ jobs.metadata.outputs.version_display }}
      run_id:
        description: Build workflow run id
        value: ${{ jobs.metadata.outputs.run_id }}

permissions:
  contents: read

env:
  MACH_MAIN_PID: "0"
  MOZ_BUILD_DATE: '${{ inputs.MOZ_BUILD_DATE }}'
  MOZ_NOSPAM: "1"
  PRE_RELEASE: '${{ inputs.PRE_RELEASE }}'
  RUST_TOOLCHAIN: "1.99.1"
  TAG_VERSION: '${{ inputs.TAG_VERSION }}'
  UWUFOX_CI_LOW_RESOURCE: '1'
  MOZ_MAKE_FLAGS: '-j1'
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'

jobs:
  metadata:
    name: Build metadata
    runs-on:
      - ubuntu-24.04
    timeout-minutes: 120
    outputs:
      run_id: ${{ steps.outputs.outputs.run_id }}
      version_display: ${{ steps.outputs.outputs.version_display }}
    steps:
      - name: Resolve version
        shell: bash
        run: |
          VERSION_DISPLAY="${TAG_VERSION}"

          {
            echo 'VERSION_DISPLAY<<EOF'
            printf '%s\n' "${VERSION_DISPLAY}"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Export metadata outputs
        id: outputs
        shell: bash
        run: |
          echo "run_id=${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "version_display=${VERSION_DISPLAY}" >> "$GITHUB_OUTPUT"

      - name: Save build metadata
        shell: bash
        run: |
          mkdir -p artifacts
          {
            echo "VERSION_DISPLAY=${VERSION_DISPLAY}"
            echo "PRE_RELEASE=${PRE_RELEASE}"
            echo "MOZ_BUILD_DATE=${MOZ_BUILD_DATE}"
            echo "TAG_VERSION=${TAG_VERSION}"
            echo "BUILD_RUN_ID=${GITHUB_RUN_ID}"
            echo "COMMIT_SHA=${GITHUB_SHA}"
          } > artifacts/build-metadata.env

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata
          path: artifacts/build-metadata.env

  compile:
    name: ${{ matrix.platform }} unsigned
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: linux-x64
            arch: x86_64-pc-linux-gnu
            apt: xvfb zstd
            rust_target: ''
            artifact: linux-build
          - platform: linux-arm64
            arch: aarch64-unknown-linux-gnu
            apt: xvfb zstd
            rust_target: aarch64-unknown-linux-gnu
            artifact: linux-aarch64-build
          - platform: windows-x64
            arch: x86_64-pc-windows-msvc
            apt: msitools zstd
            rust_target: x86_64-pc-windows-msvc
            artifact: windows-x86_64-pc-windows-msvc-build
          - platform: windows-arm64
            arch: aarch64-pc-windows-msvc
            apt: msitools zstd
            rust_target: aarch64-pc-windows-msvc
            artifact: windows-aarch64-pc-windows-msvc-build
          - platform: macos-x64
            arch: x86_64-apple-darwin
            apt: zstd
            rust_target: x86_64-apple-darwin
            artifact: macos-x86_64-apple-darwin-build
          - platform: macos-arm64
            arch: aarch64-apple-darwin
            apt: zstd
            rust_target: aarch64-apple-darwin
            artifact: macos-aarch64-apple-darwin-build
    env:
      ARCH: ${{ matrix.arch }}
      MOZCONFIG: waterfox/build/mozconfig-${{ matrix.arch }}
      ARTIFACT_NAME: ${{ matrix.artifact }}
      WINEDEBUG: '-all'
      # Keep caches in the checkout rather than duplicating files under the runner home.
      MOZBUILD_STATE_PATH: ${{ github.workspace }}/.mozbuild
      CARGO_HOME: ${{ github.workspace }}/.cargo
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
      - name: Preserve system disk and add 12 GiB swap
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk and memory before checkout:"
          df -h /
          free -h

          # Keep the stock filesystem intact. The previous volume merge
          # left only 1.8 GiB free on the root partition.
          available_gb=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          if (( available_gb < 35 )); then
            echo "::error::Only ${available_gb} GiB free on /; require at least 35 GiB."
            exit 1
          fi

          # gkrust/LLVM exhausted 15 GiB RAM + 2 GiB swap on the last run.
          sudo fallocate -l 12G /swap-uwufox
          sudo chmod 600 /swap-uwufox
          sudo mkswap /swap-uwufox
          sudo swapon /swap-uwufox
          swapon --show
          free -h
          df -h /

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Prepare writable cache directories on build volume
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MOZBUILD_STATE_PATH" "$CARGO_HOME" "$XDG_CACHE_HOME" "$SCCACHE_DIR" "$GITHUB_WORKSPACE/.tmp"
          echo "TMPDIR=$GITHUB_WORKSPACE/.tmp" >> "$GITHUB_ENV"
          echo "TMP=$GITHUB_WORKSPACE/.tmp" >> "$GITHUB_ENV"
          echo "TEMP=$GITHUB_WORKSPACE/.tmp" >> "$GITHUB_ENV"
          echo "System/root filesystem (GitHub runner logs live here):"
          df -h /
          echo "Checkout/build filesystem:"
          df -h "$GITHUB_WORKSPACE"
          echo "Rust toolchain remains at ${RUSTUP_HOME:-$HOME/.rustup}; Clang, Cargo and temp files live on the build volume."

      - name: Prepare tree
        uses: ./.github/actions/prepare-tree
        with:
          sccache-cache-name: uwufox-${{ matrix.platform }}
          apt-packages: ${{ matrix.apt }}
          rust-target: ${{ matrix.rust_target }}
          tag-version: ${{ inputs.TAG_VERSION }}
          pre-release: ${{ inputs.PRE_RELEASE }}

      - name: Configure platform and show resources
        shell: bash
        run: |
          if [[ "$ARCH" == *apple-darwin ]]; then
            echo "MOZ_PKG_FORMAT=TAR" >> "$GITHUB_ENV"
          fi
          df -h / "$GITHUB_WORKSPACE"
          free -h
          nproc

      - name: Build with resource diagnostics
        shell: bash
        run: |
          set -euo pipefail
          monitor() {
            while sleep 60; do
              echo "::group::Resource usage $(date -u +%H:%M:%S)"
              df -h / "$GITHUB_WORKSPACE"
              free -h
              echo "::endgroup::"
            done
          }
          monitor &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          if [[ "$ARCH" == *linux-gnu ]]; then
            xvfb-run -a --server-args="-screen 0 1280x1024x24" ./mach build -j 1
          else
            ./mach build -j 1
          fi

      - name: Package without signing
        shell: bash
        run: |
          set -euo pipefail
          ./mach package
          dist="obj-${ARCH}/dist"
          mkdir -p artifacts
          shopt -s nullglob

          # mach package generates platform archives (e.g. uwufox-*.tar.xz).
          # Do not assume dist/waterfox exists: the application is named uwufox.
          packages=()
          for pkg in \
            "$dist"/uwufox-*.tar.xz \
            "$dist"/uwufox-*.tar.bz2 \
            "$dist"/uwufox-*.tar.gz \
            "$dist"/uwufox-*.tar.zst \
            "$dist"/uwufox-*.tar \
            "$dist"/uwufox-*.zip \
            "$dist"/uwufox-*.dmg \
            "$dist"/uwufox-*.pkg \
            "$dist"/uwufox-*.exe \
            "$dist"/uwufox-*.msi; do
            if [[ -f "$pkg" && -s "$pkg" ]]; then
              packages+=("$pkg")
            fi
          done

          if (( ${#packages[@]} == 0 )); then
            echo "::error::mach package did not produce a recognized uwufox archive under $dist"
            find "$dist" -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          cp -v -- "${packages[@]}" artifacts/
          (cd artifacts && sha256sum -- uwufox-* > SHA256SUMS.txt)

      - name: Upload unsigned build outputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

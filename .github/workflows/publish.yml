# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Publish unsigned build

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful build workflow run ID
        required: true
        type: string
      version:
        description: Release version / tag
        required: true
        type: string
      prerelease:
        description: Mark release as pre-release
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      build_run_id:
        required: true
        type: string
      version:
        required: true
        type: string
      prerelease:
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  production:
    name: Publish to GitHub Releases
    uses: ./.github/workflows/production.yml
    permissions:
      contents: write
      actions: read
    with:
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      DISPLAY_VERSION: ${{ inputs.version }}
      PRE_RELEASE: ${{ inputs.prerelease }}
